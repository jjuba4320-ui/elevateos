<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="madakBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14162e" />
      <stop offset="100%" stop-color="#0b0d1e" />
    </linearGradient>

    <!-- Orbit Arc Gradient -->
    <linearGradient id="madakArc" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#607cf8" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Sun/Dot Glow Filter -->
    <filter id="madakGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Midnight Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#madakBg)" />

  <!-- Orbiting Productivity Arc -->
  <path
    d="M 108 162 A 184 184 0 1 0 436 270"
    fill="none"
    stroke="url(#madakArc)"
    stroke-width="32"
    stroke-linecap="round"
  />

  <!-- Golden Beacon Dot (Focus & Success) -->
  <circle
    cx="256"
    cy="152"
    r="23"
    fill="#fbbf24"
    filter="url(#madakGlow)"
  />

  <!-- Iconic 'M' Madak Peak Glyph -->
  <path
    d="M 152 328 L 222 196 L 256 268 L 290 196 L 360 328"
    fill="none"
    stroke="#ffffff"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
